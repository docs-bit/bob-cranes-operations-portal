<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BOB Cranes — Dependency Graph Explorer</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<style>
:root {
  --bg: #0f1117; --surface: #1a1d27; --surface-2: #232736;
  --border: #2d3148; --text: #e4e6ed; --muted: #8b90a5;
  --accent: #b45309; --accent-soft: rgba(180,83,9,0.15);
  --ok: #22c55e; --warn: #eab308; --bad: #ef4444;
  --blue: #3b82f6; --purple: #a855f7; --pink: #ec4899;
  --cyan: #06b6d4; --green: #10b981;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); }
.app { display: grid; grid-template-columns: 320px 1fr; height: 100vh; }

/* Sidebar */
.sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
.sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
.sidebar-header h1 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.sidebar-header p { font-size: 12px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 10px; text-align: center; }
.stat .val { font-size: 20px; font-weight: 700; color: var(--accent); }
.stat .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

.search-box { padding: 12px 20px; border-bottom: 1px solid var(--border); }
.search-box input { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); color: var(--text); font-size: 13px; }
.search-box input:focus { outline: none; border-color: var(--accent); }

.community-list { flex: 1; overflow-y: auto; padding: 8px; }
.community-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; transition: background 0.15s; margin-bottom: 2px; }
.community-item:hover { background: var(--surface-2); }
.community-item.active { background: var(--accent-soft); border: 1px solid var(--accent); }
.community-item .name { font-size: 13px; font-weight: 600; margin-bottom: 2px; }
.community-item .meta { font-size: 11px; color: var(--muted); display: flex; gap: 12px; }
.community-item .badge { display: inline-block; padding: 1px 6px; border-radius: 10px; font-size: 10px; font-weight: 600; background: var(--surface-2); color: var(--muted); }

/* Graph area */
.graph-area { position: relative; overflow: hidden; }
.graph-area svg { width: 100%; height: 100%; }

/* Controls */
.controls { position: absolute; top: 16px; right: 16px; display: flex; gap: 8px; z-index: 10; }
.ctrl-btn { padding: 8px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text); font-size: 12px; cursor: pointer; transition: all 0.15s; }
.ctrl-btn:hover { border-color: var(--accent); background: var(--accent-soft); }
.ctrl-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

/* Detail panel */
.detail-panel { position: absolute; bottom: 16px; left: 16px; right: 16px; max-height: 40vh; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; overflow-y: auto; display: none; z-index: 10; }
.detail-panel.visible { display: block; }
.detail-panel h3 { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
.detail-panel .close-btn { position: absolute; top: 12px; right: 16px; background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; }
.detail-panel .node-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; margin-top: 8px; }
.detail-panel .node-item { padding: 6px 10px; background: var(--surface-2); border-radius: 6px; font-size: 12px; }
.detail-panel .node-item .label { font-weight: 600; }
.detail-panel .node-item .file { color: var(--muted); font-size: 11px; }
.detail-panel .edge-list { margin-top: 12px; }
.detail-panel .edge-item { padding: 4px 0; font-size: 12px; border-bottom: 1px solid var(--border); }
.detail-panel .edge-item:last-child { border-bottom: none; }

/* Legend */
.legend { position: absolute; bottom: 16px; right: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-size: 11px; z-index: 10; }
.legend .item { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.legend .dot { width: 10px; height: 10px; border-radius: 50%; }

/* Tooltip */
.tooltip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 12px; max-width: 300px; z-index: 100; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
.tooltip .t-name { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
.tooltip .t-file { color: var(--muted); font-size: 11px; }
.tooltip .t-community { color: var(--accent); font-size: 11px; margin-top: 4px; }
</style>
</head>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>🔗 Dependency Graph Explorer</h1>
      <p>Interactive architecture visualization from graphify</p>
      <div class="stats">
        <div class="stat"><div class="val" id="statNodes">0</div><div class="lbl">Nodes</div></div>
        <div class="stat"><div class="val" id="statEdges">0</div><div class="lbl">Edges</div></div>
        <div class="stat"><div class="val" id="statComms">0</div><div class="lbl">Communities</div></div>
      </div>
    </div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search communities or nodes…" />
    </div>
    <div class="community-list" id="communityList"></div>
  </aside>
  <div class="graph-area">
    <svg id="graphSvg"></svg>
    <div class="controls">
      <button class="ctrl-btn" onclick="resetZoom()">Reset Zoom</button>
      <button class="ctrl-btn" id="btnShowLabels" onclick="toggleLabels()">Labels</button>
      <button class="ctrl-btn" id="btnShowCross" onclick="toggleCrossEdges()">Cross-Edges</button>
    </div>
    <div class="legend">
      <div class="item"><div class="dot" style="background:var(--accent)"></div> Large community (50+)</div>
      <div class="item"><div class="dot" style="background:var(--blue)"></div> Medium (20-49)</div>
      <div class="item"><div class="dot" style="background:var(--muted)"></div> Small (&lt;20)</div>
    </div>
    <div class="detail-panel" id="detailPanel">
      <button class="close-btn" onclick="closeDetail()">✕</button>
      <div id="detailContent"></div>
    </div>
    <div class="tooltip" id="tooltip" style="display:none"></div>
  </div>
</div>

<script>
const data = GRAPH_DATA;
let showLabels = false;
let showCrossEdges = true;
let selectedCommunity = null;
let simulation;

// Stats
document.getElementById('statNodes').textContent = data.totalNodes.toLocaleString();
document.getElementById('statEdges').textContent = data.totalLinks.toLocaleString();
document.getElementById('statComms').textContent = data.totalCommunities;

// Color scale
function communityColor(count) {
  if (count >= 50) return '#b45309';
  if (count >= 20) return '#3b82f6';
  if (count >= 10) return '#a855f7';
  return '#6b7280';
}

// Build sidebar
const communityListEl = document.getElementById('communityList');
const communityItems = data.communities.map(c => {
  const el = document.createElement('div');
  el.className = 'community-item';
  el.dataset.id = c.id;
  el.innerHTML = `
    <div class="name">${esc(c.name)}</div>
    <div class="meta">
      <span class="badge">${c.count} nodes</span>
      <span>${c.files.length} files</span>
    </div>`;
  el.onclick = () => selectCommunity(c.id);
  return el;
});
communityItems.forEach(el => communityListEl.appendChild(el));

// Search
document.getElementById('searchInput').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  communityItems.forEach(el => {
    const c = data.communities.find(c => c.id == el.dataset.id);
    const match = !q || c.name.toLowerCase().includes(q) ||
      c.nodes.some(n => n.label.toLowerCase().includes(q)) ||
      c.files.some(f => f.toLowerCase().includes(q));
    el.style.display = match ? '' : 'none';
  });
});

// D3 Graph
const graphArea = document.querySelector('.graph-area');
const svg = d3.select('#graphSvg');
const width = window.innerWidth - 320;
const height = window.innerHeight;
const g = svg.append('g');

const zoom = d3.zoom().scaleExtent([0.1, 4]).on('zoom', e => g.attr('transform', e.transform));
svg.call(zoom);

// Build graph nodes (one per community, sized by count)
const graphNodes = data.communities.map(c => ({
  id: c.id,
  name: c.name,
  count: c.count,
  files: c.files,
  nodes: c.nodes,
  radius: Math.sqrt(c.count) * 4 + 8,
  color: communityColor(c.count),
}));

const graphNodeMap = {};
graphNodes.forEach(n => graphNodeMap[n.id] = n);

// Build graph edges (aggregate cross-community edges)
const graphEdges = data.crossEdges.map(e => ({
  source: e.source,
  target: e.target,
  count: e.count,
  sourceName: e.sourceName,
  targetName: e.targetName,
})).filter(e => graphNodeMap[e.source] && graphNodeMap[e.target]);

// Create links
const link = g.append('g')
  .selectAll('line')
  .data(graphEdges)
  .join('line')
  .attr('stroke', '#2d3148')
  .attr('stroke-width', d => Math.sqrt(d.count) * 0.8)
  .attr('stroke-opacity', 0.4);

// Create nodes
const node = g.append('g')
  .selectAll('circle')
  .data(graphNodes)
  .join('circle')
  .attr('r', d => d.radius)
  .attr('fill', d => d.color)
  .attr('stroke', '#1a1d27')
  .attr('stroke-width', 2)
  .attr('cursor', 'pointer')
  .on('click', (e, d) => selectCommunity(d.id))
  .on('mouseenter', (e, d) => showTooltip(e, d))
  .on('mouseleave', hideTooltip)
  .call(d3.drag()
    .on('start', dragStarted)
    .on('drag', dragged)
    .on('end', dragEnded));

// Labels
const labels = g.append('g')
  .selectAll('text')
  .data(graphNodes.filter(d => d.count >= 20))
  .join('text')
  .text(d => d.name.length > 30 ? d.name.slice(0, 28) + '…' : d.name)
  .attr('font-size', 10)
  .attr('fill', '#e4e6ed')
  .attr('text-anchor', 'middle')
  .attr('dy', d => d.radius + 14)
  .attr('pointer-events', 'none')
  .style('display', showLabels ? '' : 'none');

// Force simulation
simulation = d3.forceSimulation(graphNodes)
  .force('link', d3.forceLink(graphEdges).id(d => d.id).distance(d => 120 - d.count * 0.3))
  .force('charge', d3.forceManyBody().strength(d => -d.radius * 8))
  .force('center', d3.forceCenter(width / 2, height / 2))
  .force('collision', d3.forceCollide().radius(d => d.radius + 5))
  .on('tick', ticked);

function ticked() {
  link
    .attr('x1', d => d.source.x)
    .attr('y1', d => d.source.y)
    .attr('x2', d => d.target.x)
    .attr('y2', d => d.target.y);
  node
    .attr('cx', d => d.x)
    .attr('cy', d => d.y);
  labels
    .attr('x', d => d.x)
    .attr('y', d => d.y);
}

function dragStarted(e, d) {
  if (!e.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x; d.fy = d.y;
}
function dragged(e, d) { d.fx = e.x; d.fy = e.y; }
function dragEnded(e, d) {
  if (!e.active) simulation.alphaTarget(0);
  d.fx = null; d.fy = null;
}

// Tooltip
function showTooltip(event, d) {
  const tooltip = document.getElementById('tooltip');
  tooltip.innerHTML = `
    <div class="t-name">${esc(d.name)}</div>
    <div class="t-file">${d.count} nodes · ${d.files.length} files</div>
    <div class="t-community">Click to explore details</div>`;
  tooltip.style.display = 'block';
  tooltip.style.left = (event.pageX + 12) + 'px';
  tooltip.style.top = (event.pageY - 10) + 'px';
}
function hideTooltip() {
  document.getElementById('tooltip').style.display = 'none';
}

// Select community
function selectCommunity(id) {
  selectedCommunity = id;
  const c = data.communities.find(c => c.id === id);
  if (!c) return;

  // Highlight in sidebar
  communityItems.forEach(el => {
    el.classList.toggle('active', el.dataset.id == id);
    if (el.dataset.id == id) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });

  // Highlight in graph
  node.attr('opacity', d => d.id === id ? 1 : 0.2);
  link.attr('opacity', d => (d.source.id === id || d.target.id === id) ? 0.8 : 0.05)
    .attr('stroke', d => (d.source.id === id || d.target.id === id) ? '#b45309' : '#2d3148');
  labels.attr('opacity', d => d.id === id ? 1 : 0.1);

  // Show connected communities
  const connected = new Set([id]);
  graphEdges.forEach(e => {
    if (e.source.id === id || e.source === id) connected.add(typeof e.target === 'object' ? e.target.id : e.target);
    if (e.target.id === id || e.target === id) connected.add(typeof e.source === 'object' ? e.source.id : e.source);
  });

  node.attr('opacity', d => connected.has(d.id) ? 1 : 0.1);
  labels.attr('opacity', d => connected.has(d.id) ? 1 : 0.05);

  // Show detail panel
  showDetail(c);
}

function showDetail(c) {
  const panel = document.getElementById('detailPanel');
  const content = document.getElementById('detailContent');

  const connectedEdges = graphEdges.filter(e => {
    const sid = typeof e.source === 'object' ? e.source.id : e.source;
    const tid = typeof e.target === 'object' ? e.target.id : e.target;
    return sid === c.id || tid === c.id;
  });

  content.innerHTML = `
    <h3>${esc(c.name)}</h3>
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px">
      ${c.count} nodes · ${c.files.length} source files · ${connectedEdges.length} cross-community connections
    </div>
    <div style="font-size:12px;font-weight:600;margin-bottom:6px">Source Files</div>
    <div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px">
      ${c.files.map(f => `<span style="padding:2px 8px;background:var(--surface-2);border-radius:4px;font-size:11px;color:var(--muted)">${esc(f)}</span>`).join('')}
    </div>
    <div style="font-size:12px;font-weight:600;margin-bottom:6px">Connected Communities</div>
    <div class="edge-list">
      ${connectedEdges.map(e => {
        const sid = typeof e.source === 'object' ? e.source.id : e.source;
        const tid = typeof e.target === 'object' ? e.target.id : e.target;
        const other = sid === c.id ? e.targetName : e.sourceName;
        const otherId = sid === c.id ? tid : sid;
        return `<div class="edge-item" style="cursor:pointer" onclick="selectCommunity(${otherId})">
          <span style="color:var(--accent)">→</span> ${esc(other)}
          <span style="float:right;color:var(--muted)">${e.count} edges</span>
        </div>`;
      }).join('')}
    </div>
    <div style="font-size:12px;font-weight:600;margin:12px 0 6px">Nodes (top 20)</div>
    <div class="node-list">
      ${c.nodes.map(n => `
        <div class="node-item">
          <div class="label">${esc(n.label)}</div>
          <div class="file">${esc(n.source_file)}${n.source_location ? ' ' + n.source_location : ''}</div>
        </div>`).join('')}
    </div>`;

  panel.classList.add('visible');
}

function closeDetail() {
  document.getElementById('detailPanel').classList.remove('visible');
  selectedCommunity = null;
  node.attr('opacity', 1);
  link.attr('opacity', 0.4).attr('stroke', '#2d3148');
  labels.attr('opacity', 1);
  communityItems.forEach(el => el.classList.remove('active'));
}

function fitGraph() {
  const nodes = graphNodes;
  if (!nodes.length) return;
  const pad = 40;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  nodes.forEach(d => {
    if (d.x < minX) minX = d.x;
    if (d.x > maxX) maxX = d.x;
    if (d.y < minY) minY = d.y;
    if (d.y > maxY) maxY = d.y;
  });
  const w = graphArea.clientWidth || 800;
  const h = graphArea.clientHeight || 600;
  const graphW = maxX - minX + pad * 2;
  const graphH = maxY - minY + pad * 2;
  const scale = Math.min(w / graphW, h / graphH, 2);
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  const t = d3.zoomIdentity
    .translate(w / 2, h / 2)
    .scale(scale)
    .translate(-cx, -cy);
  svg.transition().duration(500).call(zoom.transform, t);
}

function resetZoom() {
  fitGraph();
}

function toggleLabels() {
  showLabels = !showLabels;
  labels.style('display', showLabels ? '' : 'none');
  document.getElementById('btnShowLabels').classList.toggle('active', showLabels);
}

function toggleCrossEdges() {
  showCrossEdges = !showCrossEdges;
  link.style('display', showCrossEdges ? '' : 'none');
  document.getElementById('btnShowCross').classList.toggle('active', showCrossEdges);
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// Initial state
document.getElementById('btnShowCross').classList.add('active');

// Auto-fit after simulation cools
simulation.on('end', () => fitGraph());
setTimeout(fitGraph, 1500);
</script>
